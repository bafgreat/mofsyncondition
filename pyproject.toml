[tool.poetry]
name = "mofsyncondition"
version = "0.1.0"
description = "Tool for extracting synthesis condition of MOFs"
authors = ["Dinga Wonanke"]
license = "MIT"
readme = "README.md"
[tool.poetry.dependencies]

python = ">=3.10,<3.15"
spacy = ">=3.7.2,<3.8.0"
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl" }
inscriptis = "^2.7.0"
requests = "^2.32.5"
beautifulsoup4 = "^4.14.3"
matplotlib = "^3.10.8"
selenium = "^4.39.0"
pubchempy = "^1.0.5"
pymupdf = "^1.26.7"
pint = "0.24"
scyjava = "^1.12.1"
torch = "2.2.2"
sentence-transformers = "^5.2.0"
numpy = "<2"
nltk = "^3.9.2"
ase = "^3.26.0"
pypdf2 = "^3.0.1"



[tool.poetry.scripts]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
